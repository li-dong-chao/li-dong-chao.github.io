name: Build and deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.165.0"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --cacheDir "${RUNNER_TEMP}/hugo-cache"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
